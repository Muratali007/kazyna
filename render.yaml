services:
  - type: web
    name: kazyna
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.14.0
      - key: JWT_SECRET
        generateValue: true
      # Задаются в Render → Environment (в репозиторий не попадают)
      - key: DATABASE_URL # строка подключения Neon
        sync: false
      - key: TELEGRAM_BOT_TOKEN # токен от @BotFather
        sync: false
      - key: PUBLIC_URL # https://<имя>.onrender.com — нужен для webhook бота
        sync: false
