services:
  - type: web
    name: kazyna
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.14.0
      - key: JWT_SECRET
        generateValue: true
      # Спрашиваются при создании сервиса (в репозиторий не попадают).
      # Адрес сайта для webhook бота берётся из RENDER_EXTERNAL_URL автоматически.
      - key: DATABASE_URL # строка подключения Neon
        sync: false
      - key: TELEGRAM_BOT_TOKEN # токен от @BotFather
        sync: false
